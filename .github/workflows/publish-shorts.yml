name: 쇼츠 자동 게시

on:
  schedule:
    - cron: "17 * * * *"   # 매시 17분 (UTC 기준, 한국시간도 매시 17분)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "테스트 모드 (게시 안 함)"
        type: boolean
        default: true

concurrency:
  group: publish-shorts
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: 게시
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          DRIVE_INBOX_ID: ${{ vars.DRIVE_INBOX_ID }}
          DRIVE_DONE_ID: ${{ vars.DRIVE_DONE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          ENABLED_PLATFORMS: ${{ vars.ENABLED_PLATFORMS || 'instagram,facebook,youtube' }}
        run: python pipeline/publish.py ${{ inputs.dry_run && '--dry-run' || '' }}
