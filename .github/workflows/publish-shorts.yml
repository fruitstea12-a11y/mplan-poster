name: 쇼츠 자동 게시

on:
  schedule:
    - cron: "17 * * * *"   # 매시 17분
  workflow_dispatch:
    inputs:
      dry_run:
        description: "테스트 모드 (게시 안 함)"
        type: boolean
        default: true

concurrency:
  group: publish-shorts
  cancel-in-progress: false

jobs:
  publish:
    # 계정별로 따로 실행. 값 이름 끝에 _MPLAN / _TRAVEL 을 붙여 등록한다.
    strategy:
      fail-fast: false
      matrix:
        include:
          - account: MPLAN    # 엠플랜 학원
            label: 엠플랜
          - account: TRAVEL   # 다여니 여행
            label: 다여니
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: 게시
        env:
          ACCOUNT_NAME: ${{ matrix.label }}
          # 구글 클라이언트·드라이브 토큰은 두 계정 공용
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
          # 계정별 값
          DRIVE_INBOX_ID: ${{ vars[format('DRIVE_INBOX_ID_{0}', matrix.account)] }}
          DRIVE_DONE_ID: ${{ vars[format('DRIVE_DONE_ID_{0}', matrix.account)] }}
          META_PAGE_TOKEN: ${{ secrets[format('META_PAGE_TOKEN_{0}', matrix.account)] }}
          IG_USER_ID: ${{ vars[format('IG_USER_ID_{0}', matrix.account)] }}
          FB_PAGE_ID: ${{ vars[format('FB_PAGE_ID_{0}', matrix.account)] }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets[format('YOUTUBE_REFRESH_TOKEN_{0}', matrix.account)] }}
          YOUTUBE_CATEGORY: ${{ vars[format('YOUTUBE_CATEGORY_{0}', matrix.account)] }}
          ENABLED_PLATFORMS: ${{ vars[format('ENABLED_PLATFORMS_{0}', matrix.account)] }}
        run: python pipeline/publish.py ${{ inputs.dry_run && '--dry-run' || '' }}
